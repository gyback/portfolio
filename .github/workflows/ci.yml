name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Format check
        run: npm run format:check

      # Runs the pinned-source fetch (no-op when cached), the static export,
      # and the link check over ./out.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7
